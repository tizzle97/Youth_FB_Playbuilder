<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Analytics (gtag.js) loads conditionally from src/lib/analytics.ts,
         only after the visitor accepts the cookie consent banner (BACKLOG B-19). -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playbuilder Pro — Youth &amp; Flag Football Play Designer</title>
    <meta name="description" content="Playbuilder Pro is the play designer for youth and flag football coaches — from 5v5 flag to 11v11. Draw routes on a real field, build playbooks, and print game-day sheets." />
    <meta property="og:site_name" content="Playbuilder Pro" />
    <meta property="og:title" content="Playbuilder Pro — Youth &amp; Flag Football Play Designer" />
    <meta property="og:description" content="Draw the play. Run the play. Win the day. The play designer for youth and flag football coaches." />
    <meta property="og:url" content="https://playbuilderpro.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://playbuilderpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" media="print" />
    <noscript><link rel="stylesheet" href="https://rsms.me/inter/inter.css" /></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=swap"
      />
    </noscript>
    <!-- Flips the two stylesheets above from media="print" to media="all" once
         loaded. Must be an external file — CSP's script-src has no
         'unsafe-inline', so the inline onload="" this replaced was silently
         blocked and both stylesheets never applied. See font-loader.js. -->
    <script src="/font-loader.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics — cookieless, so unlike GA it is NOT consent-gated and
         loads for every visitor (including on /designer, where the banner is hidden).
         This is deliberately a static tag, not a conditional import like analytics.ts:
         there is no consent decision to wait for. The token is a public site token,
         same as the GA measurement ID — not a secret.
         Requires static.cloudflareinsights.com in script-src and cloudflareinsights.com
         in connect-src (public/_headers), or it fails silently. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "b57642dff5a44b7c942b23f56663faf5"}'
    ></script>
  </body>
</html>
